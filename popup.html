<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>WebGuard Island 資安靈動島</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      font-size: 12px;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .stat-row:last-child { margin-bottom: 0; }
    .muted { color: #94a3b8; }
    .list {
      max-height: 110px;
      overflow-y: auto;
      margin-top: 6px;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .item:last-child { border-bottom: none; }
    button {
      background: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    button:hover { background: rgba(255, 255, 255, 0.2); }
    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <h1>
    <span>🛡️ WebGuard Island</span>
    <span class="muted" style="font-size:11px;">v1.0</span>
  </h1>

  <div class="card">
    <div class="stat-row">
      <span class="muted">黑金封鎖清單總筆數</span>
      <strong id="threat-total" style="color:#fbbf24;">0</strong>
    </div>
    <div class="stat-row">
      <span class="muted">已記憶大陸 IP（免重查）</span>
      <strong id="cn-count">0</strong>
    </div>
    <div class="stat-row">
      <span class="muted">本地 GeoIP 總快取</span>
      <strong id="geoip-count">0</strong>
    </div>
    <div style="margin-top:8px; display:flex; justify-content:space-between; gap:6px;">
      <button id="open-lists-btn" style="flex:1; background:#09090b; border-color:#d4af37; color:#fbbf24; font-weight:700;">🔄 更新清單 (開啟網頁)</button>
      <button id="clear-cache-btn" class="btn-danger">清除 IP 快取</button>
    </div>
  </div>

  <div class="card">
    <strong>已封鎖網域 (<span id="blocked-count">0</span>)</strong>
    <div id="blocked-list" class="list"></div>
  </div>

  <div class="card">
    <strong>已忽略網站 (<span id="whitelist-count">0</span>)</strong>
    <div id="whitelist-list" class="list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
